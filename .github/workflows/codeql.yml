name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    if: vars.REPO_PUBLIC == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3  # v3
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v3
        with:
          category: "/language:${{ matrix.language }}"
