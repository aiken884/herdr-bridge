# herdr-bridge dependency vulnerability audit
# Scans runtime + dev dependencies (uv export --dev includes both) on every push to
# main / PR, plus a scheduled scan every Monday. Fails on unpatched HIGH or CRITICAL CVEs.
name: pip-audit
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'          # weekly scan, every Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          python-version: "3.11"
          version: "0.7.x"
      - run: uv sync --dev
      - name: Run pip-audit (runtime + dev deps)
        run: |
          uv pip install pip-audit
          uv export --dev --no-emit-project > /tmp/req.txt
          uv run pip-audit -r /tmp/req.txt --strict
