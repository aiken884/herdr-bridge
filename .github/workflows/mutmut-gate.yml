name: mutmut-gate
on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"
          version: "0.7.x"
      - run: uv sync --dev
      - run: uv run mutmut run
      - name: mutation score ≥ 0% (placeholder gate)
        run: |
          uv run mutmut results | tee mutmut-results.txt
          echo "mutmut-gate: baseline checkpoint only (see mutmut-results.txt)"
