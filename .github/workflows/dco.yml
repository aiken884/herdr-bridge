# herdr-bridge DCO (Developer Certificate of Origin) check
# Every commit in a PR must carry a Signed-off-by trailer.
name: dco
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco-check:
    runs-on: ubuntu-latest
    steps:
      - name: Get PR commits
        id: get-pr-commits
        uses: tim-actions/get-pr-commits@198af03565609bb4ed924d1260247b4881f09e7d  # v1.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: DCO check
        uses: tim-actions/dco@f2279e6e62d5a7d9115b0cb8e837b777b1b02e21  # v1.1.0
        with:
          commits: ${{ steps.get-pr-commits.outputs.commits }}
