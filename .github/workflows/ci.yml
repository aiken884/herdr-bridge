name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow-failure == true }}
    strategy:
      fail-fast: false  # a known-flaky/broken leg (e.g. 3.14's pydantic runner issue) must not
                         # cancel the other legs before they get a chance to report their own result
      matrix:
        # 2026-07-31 cost reduction: macOS runner-minutes bill at 10x the Linux rate, and today's
        # usage spike (many individual pushes during a busy session) burned through the monthly
        # free allowance largely on macOS minutes. Full Linux coverage across all supported Python
        # versions is cheap and stays as a cross-product; macOS is trimmed to a single version
        # (the requires-python floor) purely to catch macOS-specific issues (paths, sockets, etc.)
        # without paying the 10x multiplier 4 times over. Mirrors a related project's
        # ci.yml precedent (reduced matrix for the same cost reason).
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
            # 2026-08-02: pydantic 2.13.4 (latest on PyPI) is incompatible with CPython 3.14's
            # changed typing._eval_type() signature (TypeError: unexpected keyword argument
            # 'prefer_fwd_module') — a genuine upstream gap, not something fixable on our side.
            # fail-fast: false alone only stops this leg from cancelling the others; without
            # allow-failure the overall `ci` run still reports failure. Keep the leg running (so
            # it flips green the moment pydantic ships a fix) without blocking the workflow.
            allow-failure: true
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.7.x"   # TD-001 P1: pin the uv major version to avoid runner image drift
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - name: pytest + coverage
        run: uv run pytest -q --cov=src/herdr_bridge --cov-report=term-missing --cov-fail-under=70 -m "not integration"
      - run: uv build
      - name: package hygiene — no local logs / review scratch leak into sdist or wheel
        run: |
          python3 - <<'PY'
          import glob, sys, tarfile, zipfile
          BAD = (".codegraph", "reviews", "misjudge", "daemon.log",
                 ".dispatch", "docs/superpowers", "sandbox-evidence")
          def names(p):
              if p.endswith(".tar.gz"):
                  with tarfile.open(p) as t: return t.getnames()
              with zipfile.ZipFile(p) as z: return z.namelist()
          bad = [f"{p}: {n}" for p in glob.glob("dist/*.tar.gz") + glob.glob("dist/*.whl")
                 for n in names(p) if any(m in n for m in BAD)]
          if bad:
              print("PACKAGE HYGIENE FAIL:"); [print("  ", b) for b in bad]; sys.exit(1)
          print("package hygiene OK")
          PY
