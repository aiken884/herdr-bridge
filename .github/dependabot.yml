version: 2
updates:
  # Keep GitHub Actions up to date (and, once pinned to SHAs, bump the SHAs).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"

  # Python dev dependencies (runtime deps are intentionally zero).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
