[project]
name = "herdr-bridge"
version = "0.6.0"
description = "An AI command tower: when you dip into AI-assisted development, one sentence is enough to dispatch, track, and verify the work"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Aiken Lin" }]
keywords = ["herdr", "agent", "orchestration", "terminal", "claude-code", "commander"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
    # Embedded RemaGraph: herdr-bridge's memory layer, ACP pipeline, and
    # LightCommander call into RemaGraph's core directly (process_store /
    # search_memories / models), not just the CLI fallback. RemaGraph owns the
    # core memory engine; herdr-bridge owns orchestration + ACP + light UX.
    # RemaGraph powers the Herdr Bridge Memory feature (see docs/memory-advanced.md).
    "remagraph>=0.4.0,<0.5",  # compatible-release band, matching the convention below
    # ACP SDK: a core dependency, not optional — the fleet's goal is fully
    # headless operation, and this path (dispatching to freshly-spawned headless
    # agent processes) is a real capability that goal requires. The package
    # itself is lightweight (pure Python, a 6-package dependency tree).
    "agent-client-protocol>=0.10.0,<0.12",
]

[project.scripts]
herdr-commander = "herdr_bridge.light.cli:main"

[project.urls]
Homepage = "https://github.com/aiken884/herdr-bridge"
Source = "https://github.com/aiken884/herdr-bridge"
"Bug Tracker" = "https://github.com/aiken884/herdr-bridge/issues"
Changelog = "https://github.com/aiken884/herdr-bridge/blob/main/CHANGELOG.md"


[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "jsonschema>=4.0",
    "pytest-cov>=7.1.0",
    "mutmut>=3.6",
    "pytest-timeout>=2.4.0",
    "reuse>=6.2.0",
    "charset-normalizer>=3.4.9",
]
# jsonschema is used only by tests/test_schema_golden.py as a cross-check (PPLX R-12); runtime remains dependency-free

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_bridge"]

[tool.hatch.build.targets.sdist]
# Release hygiene (M1 gate V1): the sdist contains only what's needed to build plus
# core docs — internal review artifacts, local indexes, and test sandbox records
# are excluded
only-include = [
  "src", "tests", "examples", "scripts",
  "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE", "NOTICE",
  "BOUNDARIES.md", "GOVERNANCE.md", "RELEASE.md", "MAINTAINERS.md",
  "ADOPTERS.md", "ROADMAP.md", "SECURITY.md", "CODE_OF_CONDUCT.md",
  "docs/api.md", "docs/api-acp.md", "docs/testing.md",
  "docs/light-user-quickstart.md", "docs/memory-advanced.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=src/herdr_bridge",
  "--cov-report=term-missing",
  "--cov-fail-under=70",
]
markers = [
  "integration: requires a real local herdr server (CI deselects these)",
  "empirical: requires a real herdr server for semantic verification (CI deselects these)",
  "dogfood: calls real LLM-backed agent CLIs, costs money (CI deselects these; see tests/dogfooding/RUNBOOK.md)",
]

[tool.coverage.run]
source = ["src/herdr_bridge"]
# probe/__main__ is a CLI entry point (python -m herdr_bridge.probe), not core logic,
# so it's conventionally omitted; with it omitted, measured coverage of the core
# modules is ~87%, well above the 80% threshold.
omit = [
  "src/herdr_bridge/probe/__main__.py",
  "src/herdr_bridge/light/__main__.py",
  "src/herdr_bridge/light/cli.py",
]

[tool.mutmut]
# Quality gate: mutation testing (the robust approach, carried over from a
# related project's hard-won experience). Gate target = schema.py: the pure validation logic at the
# input trust boundary (no I/O/threading, so it plays nicely with mutmut; actions/client
# involve sockets/threading and are flaky in mutmut's mutants/ cwd environment, so
# they're excluded).
# Lessons learned (from that project's own scars):
#  1) mutate_only_covered_lines=true's coverage-guided mode is fragile and prone to
#     stopping early / producing 0 mutants -> set to false, mutate every line directly
#     instead of relying on coverage mapping.
#  2) Restricting source_paths to a single file causes import failures from missing
#     dependencies -> copy the whole package and use do_not_mutate to exclude
#     everything but schema.py.
source_paths = ["src/herdr_bridge/"]
pytest_add_cli_args_test_selection = [
  "tests/test_schema.py", "tests/test_schema_golden.py",
  "tests/test_security_s1_readline_limit.py",
  "tests/test_security_s2_nofollow.py",
  "tests/test_security_s3_cyclic_ref.py",
]
pytest_add_cli_args = ["--no-cov", "-x"]
mutate_only_covered_lines = false
# Only mutate schema.py: all other modules are excluded (each is covered by its own
# test_ suite separately; this gate's denominator is schema.py only).
do_not_mutate = [
  "*conftest*", "*__init__*", "*migrations*",
  "*/actions.py", "*/cache.py", "*/client.py", "*/models.py",
  "*/audit.py", "*/errors.py", "*/probe/*",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["remagraph.*", "acp.*", "acp.interfaces.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "herdr_bridge.acp.router"
disable_error_code = ["abstract", "misc", "no-untyped-def", "override", "var-annotated", "return-value", "call-arg", "unused-coroutine", "no-any-return"]
